<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Tile-less favicon: browsers backplate dark favicons on dark tab strips,
       so the glyph stands alone. Gold on dark UI, deeper gold on light. -->
  <style>
    g { stroke: #8a6a22; }
    @media (prefers-color-scheme: dark) { g { stroke: #c89b3c; } }
  </style>
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/>
    <line x1="13" x2="19" y1="19" y2="13"/>
    <line x1="16" x2="20" y1="16" y2="20"/>
    <line x1="19" x2="21" y1="21" y2="19"/>
    <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 10"/>
    <line x1="5" x2="9" y1="14" y2="18"/>
    <line x1="7" x2="4" y1="17" y2="20"/>
    <line x1="3" x2="5" y1="19" y2="21"/>
  </g>
</svg>
