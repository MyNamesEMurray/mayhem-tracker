name: Checks

# Typechecks the desktop app, runs the scoring tests, and builds the website -
# on every push and pull request. Before this existed, only the website was
# verified: its build runs `tsc --noEmit` with unused-symbol checks on, while
# the app's `electron-vite build` transpiles through esbuild and never
# typechecks. That asymmetry is how eleven dead imports accumulated in one
# renderer page without anything noticing.
#
# The formatting check covers the whole repository, the website and the
# Supabase edge functions included - nothing else builds those, so this is the
# only thing that looks at them at all.
#
# Deliberately does NOT build the Windows executables - that costs a Windows
# runner and several minutes, and `test-build` already does it on demand.
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On both platforms, because the app ships on Windows. Testing it only on
  # Linux let a test build a path by concatenating a file:// URL's pathname -
  # fine everywhere except the one operating system anyone runs this on, where
  # it produced "D:\D:\a\...". The release job builds on Windows and would
  # eventually have caught it, but failing a release is a slow way to hear it.
  app:
    name: App - format, typecheck & tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # Same shell the release job uses, so both see the same glob expansion
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Nothing here runs Electron or touches the database, so skip the
      # install scripts that download the Electron binary and rebuild
      # better-sqlite3 against it. Types and test sources resolve either way,
      # and it takes the job from minutes to seconds.
      - run: npm ci --ignore-scripts

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Scoring tests
        run: npm test

  website:
    name: Website - typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
        working-directory: website

      # Runs tsc --noEmit, then vite build, then the prerender pass. Prerender
      # reads live community data and fails soft, so a Supabase hiccup leaves
      # the build green rather than blocking a pull request.
      - run: npm run build
        working-directory: website
