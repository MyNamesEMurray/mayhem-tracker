name: Test Build

# Builds the Windows exes from any branch and uploads them as workflow
# artifacts — no release, no tag, invisible to the in-app updater. For
# trying out dev branches before merging.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - run: npm run dist

      - uses: actions/upload-artifact@v7
        with:
          # ref_name can contain "/", which is illegal in artifact names
          name: MayhemTracker-test-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/MayhemTracker-Portable.exe
            dist/MayhemTracker-Setup.exe
          retention-days: 7
          if-no-files-found: error
