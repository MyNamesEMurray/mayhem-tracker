name: Refresh augment descriptions

# The augment blurbs shown on hover are generated from the game's own string
# table into website/public/augment-descriptions.json, which both surfaces
# fetch at runtime. It is generated rather than fetched live because the string
# table it comes from is ~33 MB, far too much to pull down for a hover tooltip,
# so the text is resolved once and published as a small file. Published text
# goes stale: an augment added or reworded in a patch hovers with just its name
# until someone regenerates.
#
# Merging this does not cut an app release. The file is not one the app is
# built from, and both surfaces read it over the network, so the text reaches
# players at the site's next deploy and the app's next launch.
#
# So this runs the generator daily and opens a pull request on the days the
# text actually changes, which in practice means a patch moved the augment
# pool. It deliberately doesn't push to main on its own — the text is player-
# visible and comes from an upstream nobody here controls, so a human reads the
# diff first. Quiet days finish in under a minute having done nothing.
#
# Opening the PR needs "Allow GitHub Actions to create and approve pull
# requests" turned on under Settings -> Actions -> General. Without it the run
# fails on its last step with the regenerated text already pushed to a branch,
# which is still a signal that something is waiting.
on:
  schedule:
    # An hour after the daily site rebuild rather than alongside it
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# One run at a time: they push the same branch
concurrency:
  group: refresh-augment-descriptions

jobs:
  refresh:
    runs-on: ubuntu-latest
    # At job level because two steps need it, and a shell variable set in one
    # step is gone by the next
    env:
      FILE: website/public/augment-descriptions.json
    defaults:
      run:
        # pipefail, so a generator that dies mid-pipe fails the step
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The generator needs only oxfmt, to format what it writes. Skipping
      # install scripts keeps this job from downloading Electron and rebuilding
      # better-sqlite3 for a build it never runs.
      - run: npm ci --ignore-scripts

      - name: Regenerate from the current string table
        id: gen
        run: |
          # Read the file as JSON rather than by pattern, so a change to how it
          # is written cannot quietly make the collapse guard below count zero
          # and pass.
          descriptions() { node -p "Object.keys(require('./$FILE').descriptions).length"; }
          patch() { node -p "require('./$FILE').patch"; }

          WAS_COUNT=$(descriptions)
          WAS_PATCH=$(patch)

          npm run --silent gen:augments | tee generator.log

          NOW_COUNT=$(descriptions)
          NOW_PATCH=$(patch)

          # CommunityDragon serves a half-updated tree for a while on patch day,
          # and a run that caught it mid-update would quietly gut the file. A PR
          # titled "refresh" is the kind that gets merged unread, so a collapse
          # fails the run instead of becoming a diff to review.
          if [ "$NOW_COUNT" -lt $((WAS_COUNT * 4 / 5)) ]; then
            echo "::error::Described augments fell from $WAS_COUNT to $NOW_COUNT. Refusing to open a pull request — re-run once the upstream data has settled."
            exit 1
          fi

          {
            echo "was_patch=$WAS_PATCH"
            echo "now_patch=$NOW_PATCH"
            echo "was_count=$WAS_COUNT"
            echo "now_count=$NOW_COUNT"
          } >> "$GITHUB_OUTPUT"

          if git diff --quiet -- "$FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Descriptions are unchanged on patch $NOW_PATCH — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The generated file is TypeScript that the app and the site both
      # import, so it has to compile before it can be proposed.
      - name: Typecheck the generated file
        if: steps.gen.outputs.changed == 'true'
        run: npm run typecheck

      - name: Open a pull request
        if: steps.gen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOW_PATCH: ${{ steps.gen.outputs.now_patch }}
          WAS_PATCH: ${{ steps.gen.outputs.was_patch }}
          NOW_COUNT: ${{ steps.gen.outputs.now_count }}
          WAS_COUNT: ${{ steps.gen.outputs.was_count }}
        run: |
          BRANCH="augment-descriptions/patch-$NOW_PATCH"
          TITLE="Refresh augment descriptions for patch $NOW_PATCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$FILE"
          git commit -m "$TITLE" -m "Regenerated by scripts/gen-augment-descriptions.mjs. $NOW_COUNT augments carry description text, against $WAS_COUNT on patch $WAS_PATCH."

          # Nothing but this workflow writes this branch, and a later run on the
          # same patch is meant to replace the earlier proposal, not stack on it
          git push --force origin "HEAD:refs/heads/$BRANCH"

          if [ -n "$(gh pr list --state open --head "$BRANCH" --json number --jq '.[].number')" ]; then
            echo "The force push updated the open pull request for $BRANCH."
            exit 0
          fi

          {
            echo "The game's string table changed, so the hover descriptions the app and"
            echo "the site ship were regenerated from it."
            echo
            echo "- Patch \`$WAS_PATCH\` → \`$NOW_PATCH\`"
            echo "- Augments carrying description text: $WAS_COUNT → $NOW_COUNT"
            echo
            echo "Worth skimming the diff before merging: the text is player-visible, and a"
            echo "reworded augment changes quietly rather than showing up as a new line."
            echo "Merging puts the new text on the site at its next deploy; the app picks it"
            echo "up in the next release."
            echo
            echo "<details><summary>Generator output</summary>"
            echo
            echo '```'
            cat generator.log
            echo '```'
            echo
            echo "</details>"
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > pr-body.md

          gh pr create --head "$BRANCH" --base main --title "$TITLE" --body-file pr-body.md
