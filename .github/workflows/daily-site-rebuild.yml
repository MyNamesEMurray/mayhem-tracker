name: Daily site rebuild

# Rebuilds the website once a day so the prerendered champion pages and
# sitemap track the live community data between code pushes. Requires a
# Cloudflare Pages deploy hook URL stored as the CLOUDFLARE_PAGES_DEPLOY_HOOK
# repository secret (Pages project -> Settings -> Builds & deployments ->
# Deploy hooks). Does nothing until that secret exists.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No CLOUDFLARE_PAGES_DEPLOY_HOOK secret set; skipping."
            exit 0
          fi
          curl -sS -X POST "$HOOK"
