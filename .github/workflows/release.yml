name: Release

on:
  push:
    tags: ["v*"]
  # Manual trigger releases v<package.json version> from the chosen branch
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve release tag
        id: version
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [ "${TAG#v}" != "$PKG" ]; then
              echo "::error::tag $TAG does not match package.json version $PKG"
              exit 1
            fi
          else
            TAG="v$PKG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - run: npm run dist

      # On manual runs the tag doesn't exist yet; gh creates it at --target
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/MayhemTracker.exe \
            dist/MayhemTracker-Setup.exe \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
