name: Release

on:
  push:
    tags: ["v*"]
  # Manual trigger releases v<package.json version> from the chosen branch
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve release tag
        id: version
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [ "${TAG#v}" != "$PKG" ]; then
              echo "::error::tag $TAG does not match package.json version $PKG"
              exit 1
            fi
          else
            TAG="v$PKG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - run: npm run dist

      # Release notes come from this version's CHANGELOG.md section so they
      # read like notes for players; auto-generated notes are the fallback
      # if a section is missing.
      - name: Extract release notes
        id: notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          awk -v ver="$TAG" '$0 ~ "^## "ver"([^0-9.]|$)" {flag=1; next} /^## /{flag=0} flag' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            echo "args=--notes-file notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no CHANGELOG.md section for $TAG, using generated notes"
            echo "args=--generate-notes" >> "$GITHUB_OUTPUT"
          fi

      # On manual runs the tag doesn't exist yet; gh creates it at --target
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/MayhemTracker-Portable.exe \
            dist/MayhemTracker-Setup.exe \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            ${{ steps.notes.outputs.args }}
