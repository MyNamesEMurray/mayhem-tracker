name: Release

# Cutting a release means: work out the version, build the Windows executables,
# write the version back into package.json, tag the commit and publish.
#
# It happens three ways:
#
#   - a merge into main that touches the app - the usual path, and fully
#     automatic: no version to bump by hand, no tag to push;
#   - pushing a v* tag, which must match package.json;
#   - a manual run, which releases v<package.json version> from the chosen
#     branch.
#
# The repository holds the website as well as the app, so a merge that only
# changes website/, the Supabase functions, or the design canvases must not cut
# an app release. The gate job below decides, and says why in the run summary
# either way.
#
# The version is a patch bump per app merge - see .github/scripts/next-version.mts
# for the exact rule and test/next-version.test.mts for what it guarantees. To
# ship a minor or a major instead, set it in package.json and merge; a version
# that has never been tagged is taken as deliberate and released as written.
#
# Release notes come from the version's CHANGELOG.md section. A patch release
# with no section gets an empty body on purpose: the app's update window skips
# releases with nothing in them, so a build that changed nothing players can see
# doesn't put a list of commit subjects in front of them. Write a section when
# there is something to say - the gate warns, loudly and by version number,
# when it is about to cut one that has none.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

# One release at a time. Two merges landing together must not race to build,
# tag and push the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Should this cut a release?
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      bump: ${{ steps.decide.outputs.bump }}
      # The commit this push is measured against, and the paths that count as
      # the app. The release job generates notes from the same range and the
      # same filter the gate used to decide there was anything to release.
      base: ${{ steps.decide.outputs.base }}
      appPaths: ${{ steps.decide.outputs.appPaths }}
    defaults:
      run:
        shell: bash
    steps:
      # Full history and tags: the push is diffed against what main was before
      # it, and the version is worked out from the tags that already exist
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          PKG=$(node -p "require('./package.json').version")

          # Pushing a v* tag names the version outright. Nothing to work out and
          # nothing to gate: someone asked for this exact release.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            BUMP=false
            [ "$VERSION" != "$PKG" ] && BUMP=true
            {
              echo "release=true"
              echo "version=$VERSION"
              echo "bump=$BUMP"
            } >> "$GITHUB_OUTPUT"
            echo "Releasing v$VERSION, asked for by the tag push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Everything else compares two commits and releases if the app differs
          # between them. What sits on the far side depends on why this ran.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Someone pressed Run workflow, which means "ship what is sitting
            # here unreleased" - so compare against the newest release, not
            # against one push. This is how app changes that landed before this
            # workflow existed, or during a spell when it was failing, get out.
            BASE=$(node .github/scripts/next-version.mts --highest)
            SINCE="since $BASE"
            if [ -z "$BASE" ]; then
              # Nothing has ever been released, so all of it is unreleased
              NEXT=$(node .github/scripts/next-version.mts)
              {
                echo "release=true"
                echo "version=${NEXT% *}"
                echo "bump=${NEXT#* }"
              } >> "$GITHUB_OUTPUT"
              echo "Releasing v${NEXT% *} - the first release of this app." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            # A push to main: compare against what main was before it. A
            # force-push or a first push leaves no usable "before", so fall back
            # to the first parent - for a merge commit that is main's previous
            # tip, which is the same answer.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BEFORE=$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || echo "")
            fi
            if [ -z "$BEFORE" ]; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "Could not work out what this push changed, so no release was cut. Run this workflow by hand to ship whatever is sitting on main unreleased." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            BASE="$BEFORE"
            SINCE="in this push"
          fi

          CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA")

          # What the desktop app is built from. Everything else in the
          # repository - website/, supabase/, .design-sync/, .design-canvas/,
          # the workflows and their scripts, the README - ships without a new
          # executable.
          APP='^(src/|assets/|scripts/|package\.json$|package-lock\.json$|electron\.vite\.config\.ts$|tsconfig[^/]*\.json$)'
          APP_CHANGED=$(printf '%s\n' "$CHANGED" | grep -E "$APP" || true)

          if [ -z "$APP_CHANGED" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            {
              echo "### No release - the app has not changed"
              echo
              echo "Nothing $SINCE touched a file the desktop app is built from, so the existing v$PKG build still matches what is here."
              echo
              echo "<details><summary>Files changed $SINCE</summary>"
              echo
              echo '```'
              printf '%s\n' "$CHANGED"
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The app changed, so this ships. As what?
          NEXT=$(node .github/scripts/next-version.mts)
          VERSION=${NEXT% *}
          BUMP=${NEXT#* }
          {
            echo "release=true"
            echo "version=$VERSION"
            echo "bump=$BUMP"
            echo "base=$BASE"
            echo "appPaths=$APP"
          } >> "$GITHUB_OUTPUT"

          if [ "$BUMP" = "true" ]; then
            WHY="a patch bump on v$PKG, which has already shipped"
          else
            WHY="the version already set in \`package.json\`"
          fi
          {
            echo "### Releasing v$VERSION"
            echo
            echo "The app changed $SINCE, so this ships as v$VERSION - $WHY."
            echo
            echo "<details><summary>App files changed $SINCE</summary>"
            echo
            echo '```'
            printf '%s\n' "$APP_CHANGED"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # Does this version have anything to tell players?
          #
          # v2.14.5 shipped the largest set of player-visible changes in months
          # with no section, so it published empty and the app's update window
          # skipped it: nobody on the previous version was told any of it
          # existed, and it was found days later by someone opening the release
          # page. The release job now writes a section from the commit subjects
          # when there isn't one, so a release is never silently empty - but a
          # generated section is a floor, not a finish, and saying so here is
          # what gets it rewritten before anyone reads it.
          if [ "$(node .github/scripts/changelog-section.mts "v$VERSION" --check)" = "missing" ]; then
            echo "::warning title=v$VERSION has no written release notes::A section will be generated from commit subjects. Rewrite it in player language - commit subjects are written for whoever reads the diff, not for someone deciding whether to update."
            {
              echo
              echo "> [!WARNING]"
              echo "> **No \`CHANGELOG.md\` section for v$VERSION, so one will be generated.**"
              echo ">"
              echo "> It is built from the commit subjects above and committed to \`main\`"
              echo "> alongside the version bump, so this release will not publish empty."
              echo ">"
              echo "> Commit subjects are written for whoever reads the diff next, not for"
              echo "> someone deciding whether to click Update. Rewrite the section in"
              echo "> \`CHANGELOG.md\` and paste it over the release body - it is marked as"
              echo "> generated until somebody does."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo
              echo "Release notes: the \`## v$VERSION\` section of \`CHANGELOG.md\`, written by hand."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Build and publish
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.gate.outputs.version }}
      BUMP: ${{ needs.gate.outputs.bump }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # One rule for all three ways in: the gate has already settled the
      # version, including reading it off the tag when that is what triggered
      # this, so the tag is always v<that>.
      - name: Resolve release tag
        id: version
        run: echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Belt and braces against a re-run or a race: creating a release that
      # exists would fail after a full Windows build, which is a slow way to
      # find out.
      - name: Stop if it is already released
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already released"
            exit 1
          fi

      - run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      # The same checks CI runs, before anything is published under a version
      # number people will install. None of them depend on the version, so they
      # run before it is written - a failure here leaves main untouched.
      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Scoring tests
        run: npm test

      # A release should never publish empty by accident. When nobody wrote a
      # section for this version, one is built from the subjects of the commits
      # that actually touched the app - website work, Supabase work, release
      # commits and merges are left out, because players cannot see them.
      #
      # A hand-written section always wins: this only ever fills a gap. Only on
      # main, because it is committed there in the same commit as the version
      # bump - a tag push or a run off another branch takes whatever the
      # changelog already says.
      - name: Write release notes if there are none
        id: notes_generated
        if: github.ref == 'refs/heads/main' && needs.gate.outputs.base != ''
        run: |
          RESULT=$(node .github/scripts/generate-changelog.mts \
            "$VERSION" "${{ needs.gate.outputs.base }}" '${{ needs.gate.outputs.appPaths }}')
          echo "Notes for v$VERSION: $RESULT"
          if [ "${RESULT% *}" = "generated" ]; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      # The version is written and pushed before the build, so the tag lands on
      # exactly the tree the executables came from rather than on a commit that
      # only caught up to it afterwards.
      #
      # A tag push, or a manual run off some other branch, still needs the
      # version in place for electron-builder to stamp into the executables -
      # just not committed to a branch it did not come from.
      - name: Set the version for the build
        if: env.BUMP == 'true' && github.ref != 'refs/heads/main'
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # One commit carries both, because they belong to the same release: the
      # version it ships as and the notes it ships with. Runs when either has
      # something to say, so a version already set by hand in package.json
      # still gets its generated notes committed.
      - name: Set the version on main
        id: commit
        if: >-
          github.ref == 'refs/heads/main' &&
          (env.BUMP == 'true' || steps.notes_generated.outputs.generated == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$BUMP" = "true" ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            git add package.json package-lock.json
          fi
          if [ "${{ steps.notes_generated.outputs.generated }}" = "true" ]; then
            git add CHANGELOG.md
          fi

          git commit -m "Release v$VERSION" \
            -m "Cut by .github/workflows/release.yml from ${GITHUB_SHA:0:7}."

          # A push authenticated with GITHUB_TOKEN does not start another run of
          # this workflow, so there is no loop back into the trigger above.
          #
          # Rebasing onto a merge that landed while the checks ran is safe here
          # precisely because the build comes after: the executables are built
          # from the rebased tree, so they carry that merge too.
          pushed=false
          for _ in 1 2 3; do
            if git push origin "HEAD:main"; then pushed=true; break; fi
            echo "main moved while this was running; rebasing onto it"
            git pull --rebase origin main
          done
          if [ "$pushed" != true ]; then
            echo "::error::Could not push v$VERSION to main after three tries."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - run: npm run dist

      # Notes come from this version's CHANGELOG.md section so they read like
      # notes for players. By now the step above has filled that section if it
      # was empty, so reaching the no-body branch means even the commits had
      # nothing player-visible in them - which is the right outcome for a build
      # that changed nothing anyone can see, and which the update window skips.
      - name: Extract release notes
        id: notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # The same reader the gate used to decide whether to warn, so the
          # thing that checked and the thing that publishes cannot disagree
          # about what counts as a section.
          if node .github/scripts/changelog-section.mts "$TAG" > notes.md; then
            echo "args=--notes-file notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=No release notes for $TAG::Publishing with an empty body, which the app's update window skips."
            echo 'args=--notes ""' >> "$GITHUB_OUTPUT"
          fi

      # The tag doesn't exist yet on a merge or a manual run; gh creates it at
      # --target, which is the version commit when there was one.
      - name: Create GitHub release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/MayhemTracker-Portable.exe \
            dist/MayhemTracker-Setup.exe \
            --target "${{ steps.commit.outputs.sha || github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            ${{ steps.notes.outputs.args }}
